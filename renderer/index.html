<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<title>Isometric Character Studio</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1d2026;
    --border: #2c3038;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #5b8cff;
    --warn: #e0a832;
    --ok: #4caf7d;
    --err: #e0554f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, Segoe UI, sans-serif;
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 400px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  label { display: block; margin: 8px 0 4px; color: var(--muted); }
  select, input[type=text], input[type=number] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .banner {
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .banner.ok { background: rgba(76,175,125,.15); color: var(--ok); border: 1px solid rgba(76,175,125,.4); }
  .banner.warn { background: rgba(224,168,50,.15); color: var(--warn); border: 1px solid rgba(224,168,50,.4); }
  .banner.err { background: rgba(224,85,79,.15); color: var(--err); border: 1px solid rgba(224,85,79,.4); }
  #canvases { display: flex; flex-direction: column; gap: 20px; }
  .canvas-block canvas {
    background:
      linear-gradient(45deg, #2a2d33 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(-45deg, #2a2d33 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(45deg, transparent 75%, #2a2d33 75%) 0 0 / 16px 16px,
      linear-gradient(-45deg, transparent 75%, #2a2d33 75%) 0 0 / 16px 16px;
    background-color: #1a1c20;
    max-width: 100%;
    image-rendering: pixelated;
    border: 1px solid var(--border);
  }
  .canvas-block h3 { font-size: 12px; margin: 0 0 6px; color: var(--muted); }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  ul.log li { padding: 3px 0; border-bottom: 1px solid var(--border); }
  #preview-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #preview-controls input[type=range] { flex: 1; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .checkbox-row input { width: auto; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Isometric Character Studio</h1>

    <div class="card">
      <button id="btn-pick-pack">1. Selecionar pasta do personagem</button>
      <div id="pack-info" style="margin-top:8px; color: var(--muted);"></div>
    </div>

    <div id="config-section" style="display:none">
      <div id="profile-banner"></div>
      <div id="rig-banner"></div>

      <h2>Mapeamento de animacoes (clips reais do Unity)</h2>
      <label>Idle (obrigatoria)</label>
      <select id="sel-anim-idle"></select>
      <label>Walk (opcional)</label>
      <select id="sel-anim-walk"><option value="">(nenhuma)</option></select>

      <label class="checkbox-row">
        <input type="checkbox" id="chk-has-north" />
        Pacote tem view de costas (NORTH) separada
      </label>
      <select id="sel-anim-north" disabled><option value="">(usa a mesma pose de EAST)</option></select>

      <h2>Formato de saida</h2>
      <div class="row">
        <div>
          <label>Tamanho</label>
          <select id="sel-size">
            <option value="1x1">1x1 (256x448)</option>
            <option value="2x2" selected>2x2 (512x896)</option>
            <option value="3x3">3x3 (768x1344)</option>
          </select>
        </div>
        <div>
          <label>Frames idle</label>
          <input type="number" id="num-frames-idle" value="4" min="1" max="8" />
        </div>
        <div>
          <label>Frames walk</label>
          <input type="number" id="num-frames-walk" value="4" min="3" max="8" />
        </div>
      </div>
      <label>Escala do personagem dentro da celula (ajuste fino)</label>
      <input type="number" id="num-scale" value="1" step="0.05" min="0.1" max="3" />
      <div class="row">
        <div>
          <label>Deslocamento X (px)</label>
          <input type="number" id="num-offset-x" value="0" step="5" />
        </div>
        <div>
          <label>Deslocamento Y (px)</label>
          <input type="number" id="num-offset-y" value="0" step="5" />
        </div>
      </div>

      <label>Nome do personagem (pasta de saida)</label>
      <input type="text" id="txt-character-name" />

      <div class="row" style="margin-top:12px;">
        <button id="btn-preview" class="secondary">Atualizar preview</button>
        <button id="btn-bake">Bake -&gt; idle.webp / walk.webp</button>
      </div>

      <h2>Log</h2>
      <ul class="log" id="log"></ul>
    </div>
  </div>

  <div id="main">
    <div id="preview-block" class="card" style="display:none">
      <h3 style="margin-top:0">Preview (pose unica, para conferir antes do bake)</h3>
      <canvas id="preview-canvas" width="512" height="896"></canvas>
      <div id="preview-controls">
        <span>t</span>
        <input type="range" id="preview-time" min="0" max="1" step="0.01" value="0" />
        <span id="preview-time-label">0.00s</span>
      </div>
    </div>
    <div id="canvases"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
